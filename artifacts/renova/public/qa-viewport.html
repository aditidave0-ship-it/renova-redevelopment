<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary RENOVA viewport QA</title><style>body{margin:0;padding:16px;background:#e8e8ef;font:14px system-ui;color:#172940}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}iframe{width:390px;height:850px;border:0;background:white;display:block}select,button{padding:8px;font:inherit}p{max-width:720px}</style><header><strong>RENOVA layout QA — public screens only</strong><label>Width <select id="width"><option>375</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Page <select id="page"><option value="/">Homepage + approved intro</option><option value="/platform/live?mode=start" selected>Role selection</option><option value="/platform/live?mode=login">Login / verification</option><option value="/dashboard/society">Society access</option><option value="/dashboard/developer">Developer access</option><option value="/dashboard/pmc">PMC access</option><option value="/platform/live?view=profile">Professional access</option></select></label><button id="reload" type="button">Reload frame</button></header><p>Desktop-browser frames test responsive layout. They do not emulate a physical device, create test accounts, bypass authentication or demonstrate protected dashboards.</p><iframe id="qa" title="RENOVA responsive preview" src="/platform/live?mode=start" allow="autoplay"></iframe><script>const frame=document.getElementById('qa'),width=document.getElementById('width'),page=document.getElementById('page');width.addEventListener('change',()=>frame.style.width=width.value+'px');page.addEventListener('change',()=>frame.src=page.value);document.getElementById('reload').addEventListener('click',()=>frame.src=page.value);</script></html>
