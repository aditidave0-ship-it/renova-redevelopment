<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENOVA preview-only responsive QA</title><style>body{margin:0;background:#eae6df;color:#14223b;font:14px system-ui}header{padding:14px 20px;background:#14223b;color:white;display:flex;align-items:center;gap:15px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px}select{font:inherit;padding:8px;border-radius:6px;border:0}main{padding:20px;overflow:auto}iframe{border:1px solid #bdb6aa;border-radius:14px;background:#faf7f1;display:block;height:900px}p{margin:0}</style></head><body><header><strong>Preview-only responsive QA</strong><label>Viewport width<select id="width"><option>375</option><option>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Screen<select id="screen"><option value="/">Homepage + approved intro</option><option value="/platform/live?mode=start">Role selection</option><option value="/platform/live?mode=login">Account / login</option><option value="/contact">Contact / enquiry</option><option value="/ecosystem">Ecosystem</option><option value="/knowledge-centre">Knowledge centre</option><option value="/knowledge-centre/faqs">FAQs</option><option value="/about">About</option><option value="/dashboard/society">Legacy society redirect</option><option value="/dashboard/developer">Legacy developer redirect</option><option value="/dashboard/pmc">Legacy PMC redirect</option><option value="/assessment">Legacy assessment redirect</option><option value="/projects">Legacy projects redirect</option></select></label><p>No test account or verification bypass.</p></header><main><iframe id="viewport" title="RENOVA responsive viewport" width="375" src="/" allow="autoplay"></iframe></main><script>const frame=document.getElementById('viewport');document.getElementById('width').addEventListener('change',e=>frame.width=e.target.value);document.getElementById('screen').addEventListener(
